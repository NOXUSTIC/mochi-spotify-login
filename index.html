<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0f1a">
<meta name="robots" content="noindex">
<title>Mochi Spotify login</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f1a;color:#eef1ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;padding:24px;text-align:center}
.big{font-size:56px}
h1{font-size:22px;margin:12px 0 6px}
p{color:#8e96b8;line-height:1.5}
</style></head><body><main>
<div class="big">🎵</div>
<h1>Mochi × Spotify</h1>
<p id="m">Taking you back to your robot…</p>
</main>
<script>
// Spotify only sends logins to https pages, but the robot serves its app over plain http on your WiFi.
// Host this page on any https site (GitHub Pages works), use its address as the Redirect URI of your
// Spotify app, and type the same address in the Mochi app (Music tab). This page only hands the one-time
// login code back to the robot's page; the code is useless without the secret that stays there (PKCE).
(function () {
  var q = new URLSearchParams(location.search), st = q.get('state') || '', dot = st.indexOf('.'), back = null;
  try { back = new URL(atob(st.slice(dot + 1).replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) {}
  var lan = back && back.protocol === 'http:' &&
    /^(10\.\d+|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d+\.\d+$|\.local$/.test(back.hostname);   // only addresses on your own network
  if (dot < 1 || !lan) {
    document.getElementById('m').textContent = 'This page finishes the Spotify login for a Mochi robot. Start the login from the Music tab of the Mochi app.';
    return;
  }
  var p = new URLSearchParams();
  ['code', 'error', 'state'].forEach(function (k) { if (q.get(k)) p.set(k, q.get(k)); });
  location.replace(back.origin + back.pathname + '?' + p.toString());
})();
</script></body></html>
